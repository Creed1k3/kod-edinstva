:root{
  --ink:#4B3A5C; --muted:#8E7BA8; --pink:#FF6F91; --pink2:#D9506F; --yellow:#FFD166; --mint:#7EDDA3; --sky:#6EC6FF; --lilac:#A98BFF;
  --theme:#FF6F91; --ease:cubic-bezier(.16,1,.3,1);
  --p0:#FF8FAB;--p1:#FFC15E;--p2:#6EC6FF;--p3:#7EDDA3;--p4:#B79CFF;--p5:#FF9A76;--p6:#5ED3D0;--p7:#F28DD8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2b2236;overflow:hidden;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,rgba(255,138,171,.2) 2px,transparent 2.5px) 0 0/44px 44px,linear-gradient(160deg,#FFF6E8,#FFE9F1 58%,#E6F3FF)}
#dust,#fx{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.55;pointer-events:none;transition:background 1s}
#b1{left:-170px;top:-190px;width:560px;height:560px;background:color-mix(in srgb,var(--theme) 35%,#fff)}
#b2{right:-190px;bottom:-210px;width:640px;height:640px;background:#CDE9FF}
#b3{right:300px;top:-150px;width:300px;height:300px;background:#FFF0B8}
#hdr{position:absolute;left:70px;right:70px;top:34px;height:64px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.chip{display:inline-flex;align-items:center;gap:12px;padding:10px 26px;border-radius:999px;background:#fff;box-shadow:0 6px 0 rgba(75,58,92,.1);font-weight:900;font-size:26px}
.chip svg{width:28px;height:28px}
.chip.theme{background:color-mix(in srgb,var(--theme) 30%,#fff);color:color-mix(in srgb,var(--theme) 55%,#2b1a3a)}
.logo{font-family:'Pacifico',cursive;font-weight:400;font-size:34px;color:var(--pink);padding:6px 26px 8px}
.hchips{display:flex;gap:14px}
#progress{position:absolute;left:0;top:0;height:8px;background:linear-gradient(90deg,#FF6F91,#FFC15E,#6EC6FF);width:0;transition:width .6s var(--ease);z-index:6;border-radius:0 8px 8px 0}
#main{position:absolute;left:70px;right:70px;top:116px;bottom:272px;z-index:3}
#main.in>*{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.98)}}
#main.instant .rev{transition:none!important}
.rev{opacity:0;transform:translateY(24px) scale(.97);transition:opacity .6s var(--ease),transform .6s var(--ease);pointer-events:none}
.rev.on{opacity:1;transform:none;pointer-events:auto}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* карточки */
.card{background:#fff;border:5px solid #fff;border-radius:40px;box-shadow:0 10px 0 rgba(75,58,92,.09),0 26px 40px rgba(75,58,92,.1)}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:40px;padding:18px 54px;border-radius:999px;background:var(--pink);color:#fff;
  box-shadow:0 9px 0 var(--pink2),0 20px 28px rgba(217,80,111,.3);transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:translateY(5px);box-shadow:0 4px 0 var(--pink2)}
.btn.big{font-size:58px;padding:24px 78px;box-shadow:0 12px 0 var(--pink2),0 22px 30px rgba(217,80,111,.35)}
.btn.alt{background:#fff;color:var(--pink);box-shadow:0 9px 0 #efd1da}
.btn.alt:active{box-shadow:0 4px 0 #efd1da}
.btn.sm{font-size:30px;padding:12px 34px;box-shadow:0 6px 0 var(--pink2)}
.btn.sm.alt{box-shadow:0 6px 0 #efd1da}
.btn.mint{background:var(--mint);box-shadow:0 9px 0 #4aa876}
.btn[disabled]{opacity:.45;pointer-events:none}
.fld[disabled]{opacity:.5}
/* заставка */
h1.big{font-family:'Pacifico',cursive;font-weight:400;font-size:200px;line-height:1.05;color:#FF6F91;text-shadow:0 8px 0 #fff,0 14px 0 rgba(255,111,145,.25)}
.kick{font-weight:900;font-size:34px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tsub{font-weight:900;font-size:66px;margin-top:30px}
.tyear{font-size:38px;margin-top:28px;color:#7e6b96;background:#fff;padding:12px 34px;border-radius:999px;box-shadow:0 8px 0 rgba(75,58,92,.08)}
.floaty{position:absolute;width:170px;height:170px;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px) rotate(6deg)}}
.ico{display:flex;align-items:center;justify-content:center}
.ic{width:100%;height:100%;display:block;overflow:visible}
.ic .a{fill:var(--tc)}.ic .b{fill:#FFF8EC}.ic .c{fill:#6CBF6F}.ic .k{fill:#43324a}.ic .s{fill:none;stroke:#43324a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic .g{fill:none;stroke:#6CBF6F;stroke-width:4;stroke-linecap:round}.ic .l{fill:none;stroke:var(--tc);stroke-width:3;stroke-linecap:round}.ic .ch{fill:#ff7a93;opacity:.5}.ic .or{fill:#F6B73C}
.ico svg{filter:drop-shadow(0 6px 0 rgba(75,58,92,.12))}
/* титулы */
.kicker{font-weight:900;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h2.t{font-weight:900;font-size:68px;line-height:1.1;color:var(--pink)}
/* настройка команд */
.setup{display:flex;flex-direction:column;gap:22px;height:100%}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;overflow-y:auto;align-content:start;padding:6px 8px 20px;margin:0 -8px;scrollbar-width:thin;scrollbar-color:#e9c3d0 transparent}
.tcard{height:158px;display:flex;align-items:center;gap:24px;padding:0 30px;position:relative;border-bottom:12px solid var(--tc);animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.tcard .ico{width:104px;height:104px;flex:none}
.tcard .nm{font-weight:900;font-size:40px;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tgrid.dense{grid-template-columns:repeat(4,1fr);gap:18px}
.tgrid.dense .tcard{height:118px;gap:14px;padding:0 18px;border-bottom-width:9px}
.tgrid.dense .tcard .ico{width:78px;height:78px}.tgrid.dense .tcard .nm{font-size:30px}
.tgrid.dense .tcard .del{width:38px;height:38px;font-size:24px;right:8px;top:4px}
.tcard .del{position:absolute;right:14px;top:8px;width:46px;height:46px;border-radius:50%;font-size:30px;color:#c8b6d8;line-height:1}
.tcard .del:hover{background:#ffe3ea;color:var(--pink)}
.addrow{display:flex;gap:20px;align-items:center}
.fld{flex:1;height:88px;border-radius:44px;padding:0 38px;font-size:38px;font-weight:800;border:5px dashed #ffc2d2;background:#fff9fb;outline:none;transition:.2s}

#board.two{--bh:63px;--is:44px;--nf:20px;--sf:38px;--gap:10px}

#board.two .plus{min-width:44px;height:44px;font-size:22px;top:-14px}

#hud svg{width:20px;height:20px}
#help{position:absolute;inset:0;z-index:20;background:rgba(75,58,92,.55);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
#help.on{display:flex}
#help .box{width:1150px;padding:44px 60px}
#help h3{font-size:42px;color:var(--pink);margin-bottom:20px;font-weight:900}

#help td{padding:9px 8px;border-bottom:2px solid #f3e6ee}#help td:first-child{width:340px;color:var(--pink);font-weight:900}
.btnrow{display:flex;gap:16px;margin-top:26px}
kbd{font-family:'Nunito';font-weight:900;padding:2px 12px;border-radius:9px;background:#f3ecf8;border:2px solid #e3d6ee;font-size:.82em}
.toast{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:30;padding:16px 38px;border-radius:999px;font-weight:900;font-size:34px;color:#fff;
  background:var(--c);box-shadow:0 8px 0 rgba(0,0,0,.14),0 20px 40px color-mix(in srgb,var(--c) 50%,transparent);animation:toast 1.5s var(--ease) both}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

/* ================= ДАННЫЕ ИЗ ТЗ ================= */

 {n:1,title:'Общие корни',range:'Вопросы 1–4',color:'#FF6F91',icon:'tree',intro:'История — это миллион удивительных случайностей.',

  {q:'В 18 веке в Германии существовало поверье, что в один особенный день дым, поднимающийся к небу, передаёт божеству пожелания людей. В какой день это происходит и что делают люди, чтобы пустить этот «дым»?',a:'В день рождения — задувают свечи на торте.'},

 {n:2,title:'Литературные хитросплетения',range:'Вопросы 5–8',color:'#A98BFF',icon:'book',intro:'Что объединяет Шерлока Холмса, Гарри Поттера и Робинзона Крузо?',

 {n:3,title:'Природное богатство',range:'Вопросы 9–12',color:'#3FBF7F',icon:'mount',intro:'Природа умеет удивлять почище фокусников.',
  q:[
  {q:'По мнению физиков, этот представитель фауны нарушает законы аэродинамики: он слишком тяжёл для своих крыльев, чтобы летать. Но он летает! Кто он?',a:'Шмель.'},

 'В 1943 году под Сталинградом чеченец Баши Эльнакаев и русский Николай Гришкин воевали в одном подразделении. Баши был неграмотным — он виртуозно владел автоматом, но не мог написать письмо домой. Тогда Николай писал под его диктовку весточки родным Баши в Чечено-Ингушетию.',

/* ================= ЗВУК (синтез WebAudio, без файлов) ================= */
let AC=null,master=null,muted=false;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
  const b=$('#snd');if(b)b.style.opacity=0;
}
function tone(f,d,type='sine',v=.25,t0=0,f2=null,a=.005){
  if(!AC||muted)return;const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function noise(d,v=.2,t0=0,hp=2000){
  if(!AC||muted)return;const t=AC.currentTime+t0,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),da=buf.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const N=n=>440*Math.pow(2,(n-69)/12);

 buzzer(){tone(196,.9,'triangle',.3,0,98);tone(147,.9,'sine',.3,0,73);noise(.25,.1,0,500)},

/* фоновая «думалка» во время таймера: мягкая, мажорная, авторская */
const music={on:false,step:0,next:0,id:null,tempo:96};
const BASS=[48,0,0,48,43,0,0,43, 45,0,0,45,41,0,43,0];
const ARP=[72,76,79,76,72,76,79,84, 69,72,76,72,69,72,76,81];
function mstep(s,t){
  const tt=t-AC.currentTime,b=BASS[s%16];
  if(b)tone(N(b),.3,'sine',.2,tt,null,.01);
  tone(N(ARP[s%16]),.22,'triangle',.07,tt,null,.004);
  if(s%4===2)tone(N(ARP[s%16]+12),.12,'sine',.03,tt+.01);
  if(s%2)noise(.03,.025,tt,8000);
}
function musicStart(){
  if(!AC||muted||music.on)return;music.on=true;music.step=0;music.next=AC.currentTime+.06;
  music.id=setInterval(()=>{if(!AC)return;music.tempo=(T.left<=10)?124:96;
    while(music.next<AC.currentTime+.14){mstep(music.step,music.next);music.next+=60/music.tempo/4;music.step=(music.step+1)%32}},25);
}
function musicStop(){music.on=false;clearInterval(music.id)}

const T={dur:0,left:0,running:false,end:0,lastSec:-1};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function timerSet(d){T.dur=d||0;T.left=T.dur;T.running=false;T.lastSec=-1;musicStop();paintTimer()}
function timerStart(){
  if(!T.dur||T.running)return;if(T.left<=0)T.left=T.dur;
  T.running=true;T.end=performance.now()+T.left*1000;T.lastSec=Math.ceil(T.left);sfx.start();setTimeout(musicStart,420);paintTimer();
}
function timerPause(){if(!T.running)return;T.left=Math.max(0,(T.end-performance.now())/1000);T.running=false;musicStop();sfx.pause();paintTimer()}
function timerToggle(){if(T.running)timerPause();else{if(T.left<=0)T.left=T.dur;timerStart()}}
function timerStopQuiet(){if(T.running){T.left=Math.max(0,(T.end-performance.now())/1000)}T.running=false;musicStop();paintTimer()}

function paintTimer(){
  document.querySelectorAll('.tmr').forEach(el=>{
    const C=2*Math.PI*130,frac=T.dur?T.left/T.dur:0;
    const g=el.querySelector('.tg');if(g){g.style.strokeDasharray=C;g.style.strokeDashoffset=C*(1-frac)}
    el.querySelector('.tv').textContent=fmt(T.left);
    el.classList.toggle('danger',T.running&&T.left<=10&&T.left>0);
    el.classList.toggle('done',T.dur>0&&T.left<=0);
    const sm=el.querySelector('small');if(sm)sm.textContent=T.left<=0?'время вышло':T.running?'идёт время':(T.left<T.dur?'пауза':'ждём');
  });
  const b=$('#tbtn');if(b)b.textContent=T.left<=0?'Заново':T.running?'Пауза':(T.left<T.dur?'Продолжить':'Старт');
  paintHint();
}
setInterval(()=>{
  if(!T.running)return;
  T.left=Math.max(0,(T.end-performance.now())/1000);
  const sec=Math.ceil(T.left);
  if(sec!==T.lastSec){T.lastSec=sec;if(T.left>0&&T.left<=10)(T.left<=5?sfx.tickFast:sfx.tick)()}
  if(T.left<=0){T.running=false;musicStop();sfx.buzzer();onTimeUp()}
  paintTimer();
},100);

  $('#progress').style.width=(S.i/(STEPS.length-1)*100)+'%';
  main.className='instant';main.innerHTML=VIEWS[st.t](st);void main.offsetWidth;main.classList.add('in');
  $('#board').classList.toggle('hide',!!st.hideBoard);$('#board').innerHTML=boardHTML();
  $('#dock').classList.toggle('hide',!!st.noDock);$('#dock').innerHTML=dockHTML(st);
  applySub();timerSet(st.timer);
  if(st.timer&&S.sub===0&&!st.manual)timerStart();
  paintHint();
  if(st.t==='results')animateBars();
  if(st.t==='setup')setTimeout(()=>{const f=$('#newteam');if(f)f.focus()},700);

}
function applySub(){main.querySelectorAll('.rev').forEach(el=>el.classList.toggle('on',+el.dataset.sub<=S.sub))}

  audioInit();const st=STEPS[S.i];if(st.hideBoard)return;const t=S.teams.find(x=>x.id===id);if(!t)return;

/* ================= ЭФФЕКТЫ ================= */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxOn=false;
function confetti(x,y,n=80){
  const cols=['#FF6F91','#FFC15E','#6EC6FF','#7EDDA3','#B79CFF','#FF9A76','#fff'];
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,s=6+Math.random()*13;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8,g:.35,w:9+Math.random()*10,h:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[k%cols.length],life:110+Math.random()*60})}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  fctx.clearRect(0,0,1920,1080);parts=parts.filter(p=>p.life>0&&p.y<1150);
  parts.forEach(p=>{p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;fctx.save();fctx.globalAlpha=Math.min(1,p.life/30);fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fctx.restore()});
  if(parts.length)requestAnimationFrame(fxLoop);else fxOn=false;
}
const dust=$('#dust'),dctx=dust.getContext('2d');
const BC=['255,138,171','255,193,94','110,198,255','126,221,163','183,156,255'];
const dp=Array.from({length:26},()=>({x:Math.random()*1920,y:Math.random()*1080,r:14+Math.random()*34,s:.18+Math.random()*.4,a:Math.random()*6.28,c:BC[Math.floor(Math.random()*BC.length)]}));
let lastD=0;
function dustLoop(t){
  if(t-lastD>33){lastD=t;dctx.clearRect(0,0,1920,1080);
    dp.forEach(p=>{p.y-=p.s;p.a+=.01;p.x+=Math.sin(p.a)*.4;if(p.y<-60){p.y=1140;p.x=Math.random()*1920}
      dctx.beginPath();dctx.fillStyle=`rgba(${p.c},.2)`;dctx.arc(p.x,p.y,p.r,0,7);dctx.fill();
      dctx.beginPath();dctx.strokeStyle=`rgba(${p.c},.45)`;dctx.lineWidth=2;dctx.arc(p.x,p.y,p.r,0,7);dctx.stroke()})}
  requestAnimationFrame(dustLoop);
}
requestAnimationFrame(dustLoop);

function paintHud(){$('#hud').innerHTML=`<button data-act="mute">${line(muted?'mute':'sound')}${muted?'Без звука':'Звук'}</button><button data-act="full">${line('full')}Полный экран</button><button data-act="help">${line('help')}Помощь</button>`}
function helpHTML(){
  const k=[['→  /  пробел','Дальше (на вопросах сначала показывает ответ)'],['←','Назад'],['Enter  /  T','Пауза и продолжение таймера'],['R','Таймер заново'],['1 … 9','Очко команде по номеру (повторно — снять)'],['Shift + 1 … 9','Снять очко'],['M','Звук вкл/выкл'],['F','Полный экран'],['H','Эта подсказка'],['G','Перейти к шагу по номеру']];
  $('#help').innerHTML=`<div class="card box"><h3>Управление игрой</h3><table>${k.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
  <p style="margin-top:14px;color:var(--muted);font-size:22px;font-weight:700">Всё это можно делать и мышью: кнопки внизу экрана, нажатие на команду — очко, нажатие на кольцо таймера — пауза.</p>
  <div class="btnrow"><button class="btn sm" data-act="close">Закрыть</button><button class="btn sm alt" data-act="reset">Новая игра (сбросить всё)</button></div></div>`;
}
document.addEventListener('keyup',e=>{if(e.key===' '&&!(e.target.matches&&e.target.matches('input,textarea')))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();
  if(e.target.matches&&e.target.matches('input,textarea')){
    if(e.key==='Enter'&&e.target.id==='newteam'){e.preventDefault();addTeam()}
    else if(e.key==='Escape')e.target.blur();
    return}
  audioInit();const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev()}
  else if(k==='Enter'||k==='t'||k==='T'||k==='е'||k==='Е'){e.preventDefault();if(STEPS[S.i].timer)timerToggle();else next()}
  else if(k==='r'||k==='R'||k==='к'||k==='К'){if(STEPS[S.i].timer){timerSet(STEPS[S.i].timer);timerStart()}}
  else if(/^(Digit|Numpad)[1-9]$/.test(e.code)){const t=S.teams[+e.code.slice(-1)-1];if(t)award(t.id,e.shiftKey)}
  else if(k==='m'||k==='M'||k==='ь'||k==='Ь')toggleMute();
  else if(k==='f'||k==='F'||k==='а'||k==='А')toggleFull();
  else if(k==='h'||k==='H'||k==='р'||k==='Р'||k==='?')helpToggle();
  else if(k==='Escape')helpToggle(false);
  else if(k==='g'||k==='G'||k==='п'||k==='П'){const n=prompt('Шаг (1–'+STEPS.length+'):',S.i+1);if(n)go(+n-1)}
});
document.addEventListener('click',e=>{
  audioInit();
  setTimeout(()=>{const f=document.activeElement;if(f&&f.tagName==='BUTTON')f.blur()},0);
  const a=e.target.closest('[data-act]'),tm=e.target.closest('[data-team]'),dl=e.target.closest('[data-del]'),ab=e.target.closest('[data-ab]');
  if(a){const v=a.dataset.act;
    if(v==='next')next();else if(v==='prev')prev();else if(v==='add')addTeam();
    else if(v==='timer'){if(T.left<=0){timerSet(STEPS[S.i].timer);timerStart()}else timerToggle()}
    else if(v==='mute')toggleMute();else if(v==='full')toggleFull();else if(v==='help'){helpHTML();helpToggle(true)}
    else if(v==='close')helpToggle(false);
    else if(v==='restart')resetGame(false);
    else if(v==='restart-same')resetGame(true);
    else if(v==='reset'){
      if(a.dataset.sure==='1')resetGame(false);
      else{a.dataset.sure='1';a.textContent='Точно сбросить? Нажмите ещё раз';setTimeout(()=>{a.dataset.sure='0';a.textContent='Новая игра (сбросить всё)'},4000)}}}
  else if(ab){S.ab[+ab.dataset.ab]=1;save();paintAb();sfx.reveal()}
  else if(dl)delTeam(+dl.dataset.del);
  else if(tm)award(+tm.dataset.team,e.shiftKey);
});
document.addEventListener('contextmenu',e=>{const tm=e.target.closest('[data-team]');if(tm){e.preventDefault();award(+tm.dataset.team,true)}});
helpHTML();paintHud();
(()=>{const m=location.hash.match(/step=(\d+)(?:&sub=(\d+))?/);if(m){S.i=+m[1];S.sub=+(m[2]||0)}})();
if(S.i>=STEPS.length)S.i=0;
render();
window.__game={S,STEPS,go,next,prev,award,render,addTeam};

</script>
</body>
</html>
